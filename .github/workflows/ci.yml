name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go test -race ./...

  toolchain:
    # Building only on the newest Go hides a broken go directive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"

      - run: go build ./...
        env:
          GOTOOLCHAIN: auto

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

      - name: packages install and run as their service user
        run: |
          for image in ubuntu:24.04 fedora:41 alpine:3.20; do
            case "$image" in
              ubuntu*) format=deb ;;
              fedora*) format=rpm ;;
              alpine*) format=apk ;;
            esac
            echo "::group::$image ($format)"
            docker run --rm \
              -v "$PWD/dist":/pkg:ro \
              -v "$PWD/packaging/verify-install.sh":/verify.sh:ro \
              "$image" sh /verify.sh "$format" /pkg
            echo "::endgroup::"
          done

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
